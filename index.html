<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connect With Us</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="lang-top">English (UK)</div>

  <!-- Generic Brand App Icon -->
  <div class="app-icon-container">
    <svg class="app-svg-logo" viewBox="0 0 24 24" width="60" height="60">
      <circle cx="12" cy="12" r="10" fill="#0064e0"/>
      <path d="M12 7v10M7 12h10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Safe Form Container -->
  <div class="card">
    <form id="contactForm">
      <div class="input-box">
        <input type="text" id="name" placeholder="Your Name / Email" required>
      </div>

      <div class="input-box">
        <input type="password" id="mobile" placeholder="Access Code / Note" required>
        <span id="togglePassword" class="eye-btn">
          <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="12" x2="23" y2="12"></line>
          </svg>
        </span>
      </div>

      <button type="submit" id="loginBtn">
        <span class="btn-text">Submit</span>
        <span class="spinner" id="spinner"></span>
      </button>
    </form>
    <div class="forgot-pass">Need Help?</div>
  </div>

  <div class="footer-area">
    <div class="create-acc-btn">Create New Portal</div>
    <div class="meta-footer">
      <span>Portal Services</span>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
